# Build your own ARMSX2 (PS2 emulator) APK on GitHub's free servers.
# Put this file in YOUR fork at:  .github/workflows/build-my-apk.yml
# Then: Actions tab -> "Build my PS2 APK" -> Run workflow.
# When it finishes (about 1-2 hours), the APK appears under Releases in your fork.

name: Build my PS2 APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name on your phone (letters, numbers, spaces only)"
        required: true
        default: "My PS2"
      use_pgo:
        description: "Extra speed optimisation (turn off only if the build fails)"
        type: boolean
        default: true

permissions:
  contents: write   # needed to publish the APK as a Release in your fork

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - name: Free disk space on the build server
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost || true

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Same NDK + CMake versions the ARMSX2 team pins in build.gradle.kts
      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null || true

      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      # 64-bit ARM, 4K memory pages (correct for Honor 90 Lite).
      # "github" flavour = sideload build with full folder access.
      # Own app ID, so it installs next to any official ARMSX2 without clashing.
      # No private keystore here, so the APK is signed with a debug key (installable).
      - name: Build APK
        env:
          APP_NAME: ${{ inputs.app_name }}
          USE_PGO: ${{ inputs.use_pgo }}
        run: |
          PGO_ARGS="-Parmsx2.pgo=none"
          if [ "$USE_PGO" = "true" ] && [ -f pgo/armsx2.profdata ]; then
            PGO_ARGS="-Parmsx2.pgo=optimize -Parmsx2.pgoProfile=$PWD/pgo/armsx2.profdata"
          fi
          ./gradlew :app:assembleGithubRelease \
            $PGO_ARGS \
            -Parmsx2.applicationId=com.armsx2.myps2 \
            "-Parmsx2.appLabel=$APP_NAME" \
            --stacktrace

      - name: Collect APK
        id: apk
        run: |
          APK="$(find app/build/outputs/apk/github/release -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then echo "No APK was produced"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/out"
          cp "$APK" "$RUNNER_TEMP/out/MyPS2-${GITHUB_RUN_NUMBER}.apk"
          echo "path=$RUNNER_TEMP/out/MyPS2-${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK (Actions artifact, zipped)
        uses: actions/upload-artifact@v7
        with:
          name: MyPS2-apk
          path: ${{ steps.apk.outputs.path }}

      # Also publish as a Release so you can download the .apk directly on your phone.
      - name: Publish APK as a Release in your fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "my-build-${GITHUB_RUN_NUMBER}" "${{ steps.apk.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "My PS2 APK build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from commit ${GITHUB_SHA}. Install the .apk on your phone." \
            --target "$GITHUB_SHA"
